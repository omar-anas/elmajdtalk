<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <title>elmajdacademy</title>
    <link rel="shortcut icon" href="../images/logo.svg" />
    <link rel="apple-touch-icon" href="../images/logo.svg" />
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="elmajdacadmy" />
    <meta property="og:type" content="app-webrtc" />
    <meta property="og:site_name" content="MiroTalk SFU" />
    <meta property="og:title" content="Click the link to make a call." />
    <meta property="og:description" content="MiroTalk SFU calling provides real-time video calls, messaging and screen sharing." />
    <meta property="og:image" content="https://sfu.mirotalk.com/images/mirotalksfu.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:400,600" />
    <link rel="stylesheet" href="../css/landing.css" />
    <script async src="../js/Umami.js"></script>
    <script src="https://unpkg.com/animejs@3.0.1/lib/anime.min.js"></script>
    <script src="https://unpkg.com/scrollreveal@4.0.0/dist/scrollreveal.min.js"></script>
    <script src="https://rawgit.com/leizongmin/js-xss/master/dist/xss.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body class="is-boxed has-animations">
    <div class="body-wrap">
        <header class="site-header">
            <div class="container">
                <div class="site-header-inner">
                    <div class="brand header-brand">
                        <h1 class="m-0">
                            <a href="/">
                                <img class="header-logo-image" width="200px" height="300px" src="../images/logo.png" alt="Logo" />
                            </a>
                        </h1>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <section class="hero">
                <div class="container">
                    <div class="hero-inner">
                        <div class="hero-copy">
                            <div id="loginForm">
                                <br />
                                <div class="mb-12">
                                    <input id="password" class="form-input" type="password" style="border-radius: 6px" placeholder=" من فضلك أدخل الرقم السري" required />
                                </div>
                                <div class="mt-24 mb-32">
                                    <button id="loginButton" class="button button-primary button-block"> الإنضمام للغرفة </button>
                                </div>
                            </div>
                            <script>
                               
                                

                                let passwordInput = document.getElementById('password');
                                let loginBtn = document.getElementById('loginButton');

                                passwordInput.onkeyup = (e) => {
                                    if (e.keyCode === 13) {
                                        e.preventDefault();
                                        login();
                                    }
                                };

                                loginBtn.onclick = (e) => {
                                    login();
                                };

                                function getRoomIdFromUrl() {
                                    const url = window.location.href;
                                    const urlObj = new URL(url);
                                    const pathname = urlObj.pathname;
                                    const segments = pathname.split('/');
                                    const roomId = segments[segments.length - 1];
                                    return roomId;
                                }

                                async function joinRoom(roomId, password) {
                                    try {
                                        var hashedPassword = CryptoJS.SHA256(password).toString();
                                        if(hashedPassword){
                                            console.log(hashedPassword);
                                            return
                                        }
                                        const url = `/join/${roomId}?password=${encodeURIComponent(hashedPassword)}`;
                                        window.location.href = url;
                                    } catch (error) {
                                        console.error('Error joining room:', error);
                                    }
                                }

                                function login() {
                                    const password = filterXSS(document.getElementById('password').value);
                                    if (password) {
                                        let roomId = getRoomIdFromUrl();
                                        joinRoom(roomId, password);
                                    } else {
                                        alert('Password required');
                                    }
                                }
                            </script>
                        </div>
                        <div class="hero-figure anime-element">
                            <svg class="placeholder" width="528" height="396" viewBox="0 0 528 396">
                                <rect width="528" height="396" style="fill: transparent" />
                            </svg>
                            <div class="hero-figure-box hero-figure-box-01" data-rotation="45deg"></div>
                            <div class="hero-figure-box hero-figure-box-02" data-rotation="-45deg"></div>
                            <div class="hero-figure-box hero-figure-box-03" data-rotation="0deg"></div>
                            <div class="hero-figure-box hero-figure-box-04" data-rotation="-135deg"></div>
                            <div class="hero-figure-box hero-figure-box-05"></div>
                            <div class="hero-figure-box hero-figure-box-06"></div>
                            <div class="hero-figure-box hero-figure-box-07"></div>
                            <div class="hero-figure-box hero-figure-box-08" data-rotation="-22deg"></div>
                            <div class="hero-figure-box hero-figure-box-09" data-rotation="-52deg"></div>
                            <div class="hero-figure-box hero-figure-box-10" data-rotation="-50deg"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <div class="container">
                <div class="site-footer-inner">
                    <div class="brand footer-brand">
                        <a href="/">
                            <img class="header-logo-image" src="../images/logo.png" alt="Logo" />
                        </a>
                    </div>
                    <div class="footer-copyright">&copy; elmajdacademy</div>
                </div>
            </div>
        </footer>
    </div>
    <script defer src="../js/landing.js"></script>
    <script async defer src="https://buttons.github.io/buttons.js"></script>
</body>
</html>
